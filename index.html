<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Cream Goals</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');

:root {
  --cream:#fffaf0;
  --text:#41413f;
  --muted:#949087;
  --border:rgba(70,65,55,.11);

  --lemon:#f4df83;
  --lemon-bg:#fff5c9;

  --pistachio:#c9dcb5;
  --pistachio-bg:#edf4e5;

  --blueberry:#b8c4e2;
  --blueberry-bg:#e8ecf7;

  --cappuccino:#cbb49b;
  --cappuccino-bg:#eee3d6;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  padding:14px;
  background:transparent;
  color:var(--text);
  font-family:"Plus Jakarta Sans",sans-serif;
}

.app {
  width:100%;
  max-width:720px;
  margin:auto;
}

/* HEADER */

.header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.title {
  margin:0;
  font-family:"Playfair Display",serif;
  font-size:25px;
  font-weight:600;
}

.subtitle {
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
}

.sound-button {
  width:34px;
  height:34px;
  border:1px solid var(--border);
  border-radius:50%;
  background:var(--cream);
  cursor:pointer;
  font-size:14px;
}

/* ADD */

.add-box {
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:16px;
  padding:10px;
  margin-bottom:14px;
}

.goal-input {
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  padding:6px;
  font-family:inherit;
  font-size:13px;
  color:var(--text);
}

.goal-input::placeholder {
  color:#aaa69d;
}

.goal-controls {
  display:flex;
  gap:5px;
  margin-top:5px;
  flex-wrap:wrap;
}

.type-button {
  border:0;
  padding:6px 9px;
  border-radius:11px;
  font-family:inherit;
  font-size:9px;
  cursor:pointer;
}

.type-button.active {
  outline:1.5px solid rgba(60,60,55,.35);
}

.quick {
  background:var(--lemon-bg);
}

.small {
  background:var(--pistachio-bg);
}

.big {
  background:var(--blueberry-bg);
}

.future {
  background:var(--cappuccino-bg);
}

.add-button {
  margin-left:auto;
  border:0;
  border-radius:11px;
  padding:6px 12px;
  background:var(--text);
  color:white;
  font-family:inherit;
  font-size:9px;
  cursor:pointer;
}

/* FILTER */

.filters {
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin-bottom:12px;
}

.filter {
  border:1px solid var(--border);
  background:transparent;
  border-radius:12px;
  padding:5px 9px;
  white-space:nowrap;
  font-family:inherit;
  font-size:9px;
  color:var(--text);
  cursor:pointer;
}

.filter.active {
  background:var(--cream);
}

/* SECTIONS */

.goal-section {
  margin-bottom:13px;
}

.section-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:5px;
  padding:0 3px;
}

.section-title {
  display:flex;
  align-items:center;
  gap:5px;
  font-size:10px;
  font-weight:500;
}

.section-count {
  color:var(--muted);
  font-size:8px;
}

.section-line {
  flex:1;
  height:1px;
  margin-left:7px;
  background:var(--border);
}

/* GOAL CARD */

.goals {
  display:flex;
  flex-direction:column;
  gap:5px;
}

.goal {
  position:relative;
  border:1px solid var(--border);
  border-radius:11px;
  padding:7px 8px;
  transition:.15s;
}

.goal.quick-goal {
  background:var(--lemon-bg);
}

.goal.small-goal {
  background:var(--pistachio-bg);
}

.goal.big-goal {
  background:var(--blueberry-bg);
}

.goal.future-goal {
  background:var(--cappuccino-bg);
}

.goal.dragging {
  opacity:.45;
}

.goal.drag-over {
  outline:2px dashed rgba(60,60,55,.3);
}

/* MAIN ROW */

.goal-main {
  display:flex;
  align-items:center;
  gap:6px;
  min-height:25px;
}

/* DRAG HANDLE */

.drag-handle {
  width:18px;
  height:22px;
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:grab;
  font-size:11px;
  padding:0;
  touch-action:none;
}

.drag-handle:active {
  cursor:grabbing;
}

/* CHECK */

.checkbox {
  width:18px;
  height:18px;
  min-width:18px;
  border-radius:50%;
  border:1px solid rgba(60,60,55,.28);
  background:rgba(255,255,255,.3);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  padding:0;
}

.completed .checkbox {
  background:var(--text);
  color:white;
}

/* CONTENT */

.goal-content {
  flex:1;
  min-width:0;
}

.goal-name {
  font-size:11px;
  line-height:1.3;
  word-break:break-word;
}

.completed .goal-name {
  text-decoration:line-through;
  color:var(--muted);
}

.goal-type {
  display:none;
}

/* ACTIONS */

.goal-actions {
  display:flex;
  align-items:center;
  gap:1px;
}

.icon-button {
  width:23px;
  height:23px;
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:6px;
  cursor:pointer;
  font-size:10px;
  padding:0;
}

.icon-button:hover {
  background:rgba(255,255,255,.45);
  color:var(--text);
}

/* SUBTASK TOGGLE */

.subtask-toggle {
  border:0;
  background:transparent;
  color:var(--muted);
  font-family:inherit;
  font-size:8px;
  padding:3px 0 0 31px;
  cursor:pointer;
}

/* SUBTASKS */

.subtasks {
  margin-left:31px;
  margin-top:4px;
  display:flex;
  flex-direction:column;
  gap:2px;
}

.subtask {
  display:flex;
  align-items:center;
  gap:5px;
  min-height:21px;
}

.subtask-checkbox {
  width:13px;
  height:13px;
  min-width:13px;
  border-radius:3px;
  border:1px solid rgba(60,60,55,.28);
  background:rgba(255,255,255,.35);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:7px;
  padding:0;
}

.subtask.done .subtask-checkbox {
  background:var(--text);
  color:white;
}

.subtask-text {
  flex:1;
  font-size:9px;
  line-height:1.3;
}

.subtask.done .subtask-text {
  text-decoration:line-through;
  color:var(--muted);
}

.subtask-delete {
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:10px;
  cursor:pointer;
}

.subtask-input-row {
  display:flex;
  gap:4px;
  margin-top:3px;
}

.subtask-input {
  flex:1;
  border:0;
  border-bottom:1px solid var(--border);
  outline:0;
  background:transparent;
  font-family:inherit;
  font-size:9px;
  padding:3px 1px;
  color:var(--text);
}

.subtask-add {
  border:0;
  border-radius:6px;
  background:rgba(255,255,255,.45);
  font-size:9px;
  cursor:pointer;
  padding:3px 7px;
}

.subtask-progress {
  color:var(--muted);
  font-size:8px;
  margin-top:3px;
}

/* EMPTY */

.empty {
  text-align:center;
  padding:22px 10px;
  color:var(--muted);
  font-size:10px;
}

.empty-icon {
  font-size:22px;
  margin-bottom:5px;
}

/* PROGRESS */

.progress-area {
  margin-top:15px;
  padding:9px 11px;
  border-radius:13px;
  background:rgba(255,250,240,.65);
  border:1px solid var(--border);
}

.progress-top {
  display:flex;
  justify-content:space-between;
  font-size:9px;
  color:var(--muted);
  margin-bottom:5px;
}

.progress-bar {
  height:5px;
  background:rgba(80,75,65,.08);
  border-radius:20px;
  overflow:hidden;
}

.progress-fill {
  height:100%;
  width:0%;
  background:linear-gradient(
    90deg,
    var(--lemon),
    var(--pistachio),
    var(--blueberry)
  );
  border-radius:20px;
  transition:width .35s ease;
}

/* EDIT */

.edit-input {
  flex:1;
  min-width:0;
  border:0;
  border-bottom:1px solid rgba(60,60,55,.18);
  outline:0;
  background:transparent;
  font-family:inherit;
  font-size:11px;
  color:var(--text);
  padding:3px 2px;
}

.edit-type {
  border:0;
  border-radius:7px;
  background:rgba(255,255,255,.45);
  font-family:inherit;
  font-size:8px;
  padding:4px;
  color:var(--text);
}

/* CONFETTI */

.confetti {
  position:fixed;
  width:7px;
  height:7px;
  pointer-events:none;
  z-index:9999;
  animation:fall .9s ease-out forwards;
}

@keyframes fall {
  0% {
    transform:translate(0,0) rotate(0);
    opacity:1;
  }

  100% {
    transform:translate(var(--x),var(--y)) rotate(720deg);
    opacity:0;
  }
}

@media(max-width:500px) {

  body {
    padding:10px;
  }

  .title {
    font-size:22px;
  }

  .add-button {
    width:100%;
    margin-left:0;
  }

  .type-button {
    flex:1;
  }

  .goal {
    padding:6px 7px;
  }

}

@media(prefers-reduced-motion:reduce) {

  *,
  *::before,
  *::after {
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div>
      <h1 class="title">My Goals</h1>
      <div class="subtitle">small steps → big life</div>
    </div>

    <button
      type="button"
      class="sound-button"
      id="soundButton">
      🔊
    </button>

  </div>


  <!-- ADD -->

  <div class="add-box">

    <input
      id="goalInput"
      class="goal-input"
      maxlength="120"
      placeholder="What do you want to make happen?"
      autocomplete="off">

    <div class="goal-controls">

      <button
        type="button"
        class="type-button quick active"
        data-type="quick">
        🍋 Quick
      </button>

      <button
        type="button"
        class="type-button small"
        data-type="small">
        🥑 Small
      </button>

      <button
        type="button"
        class="type-button big"
        data-type="big">
        🫐 Big
      </button>

      <button
        type="button"
        class="type-button future"
        data-type="future">
        ☕ Future
      </button>

      <button
        type="button"
        class="add-button"
        id="addButton">
        + Add
      </button>

    </div>

  </div>


  <!-- FILTERS -->

  <div class="filters">

    <button class="filter active" data-filter="all">
      All
    </button>

    <button class="filter" data-filter="quick">
      🍋 Quick
    </button>

    <button class="filter" data-filter="small">
      🥑 Small
    </button>

    <button class="filter" data-filter="big">
      🫐 Big
    </button>

    <button class="filter" data-filter="future">
      ☕ Future
    </button>

    <button class="filter" data-filter="completed">
      ✓ Done
    </button>

  </div>


  <!-- GOALS -->

  <div id="sections"></div>


  <!-- PROGRESS -->

  <div class="progress-area">

    <div class="progress-top">
      <span>Your progress</span>
      <span id="progressText">0 / 0</span>
    </div>

    <div class="progress-bar">
      <div
        class="progress-fill"
        id="progressFill">
      </div>
    </div>

  </div>

</div>


<script>

(function() {

  const input =
    document.getElementById("goalInput");

  const addButton =
    document.getElementById("addButton");

  const sections =
    document.getElementById("sections");

  const progressText =
    document.getElementById("progressText");

  const progressFill =
    document.getElementById("progressFill");

  const soundButton =
    document.getElementById("soundButton");


  /* -------------------------
     DATA
  ------------------------- */

  let goals = [];

  try {

    goals =
      JSON.parse(
        localStorage.getItem("iceCreamGoals") || "[]"
      );

    if (!Array.isArray(goals)) {
      goals = [];
    }

  } catch(e) {

    goals = [];

  }


  /* Make old goals compatible */

  goals.forEach(goal => {

    if (!Array.isArray(goal.subtasks)) {
      goal.subtasks = [];
    }

    if (typeof goal.subtasksOpen !== "boolean") {
      goal.subtasksOpen = false;
    }

  });


  let selectedType = "quick";
  let activeFilter = "all";
  let soundEnabled = true;


  const sectionInfo = {

    quick: {
      icon:"🍋",
      name:"Quick",
      description:"tiny wins"
    },

    small: {
      icon:"🥑",
      name:"Small",
      description:"build momentum"
    },

    big: {
      icon:"🫐",
      name:"Big",
      description:"important moves"
    },

    future: {
      icon:"☕",
      name:"Future",
      description:"not now"
    }

  };


  /* -------------------------
     TYPE BUTTONS
  ------------------------- */

  document
    .querySelectorAll(".type-button")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          selectedType =
            button.dataset.type;

          document
            .querySelectorAll(".type-button")
            .forEach(btn =>
              btn.classList.remove("active")
            );

          button.classList.add("active");

        }
      );

    });


  /* -------------------------
     FILTERS
  ------------------------- */

  document
    .querySelectorAll(".filter")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          activeFilter =
            button.dataset.filter;

          document
            .querySelectorAll(".filter")
            .forEach(btn =>
              btn.classList.remove("active")
            );

          button.classList.add("active");

          render();

        }
      );

    });


  /* -------------------------
     ADD GOAL
  ------------------------- */

  function addGoal() {

    const text =
      input.value.trim();

    if (!text) {

      input.focus();

      return;

    }


    goals.push({

      id:
        Date.now() +
        Math.random(),

      text:text,

      type:selectedType,

      completed:false,

      subtasks:[],

      subtasksOpen:false

    });


    save();

    input.value = "";

    render();

    input.focus();

  }


  addButton.addEventListener(
    "click",
    addGoal
  );


  input.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        event.preventDefault();

        addGoal();

      }

    }
  );


  /* -------------------------
     COMPLETE
  ------------------------- */

  function completeGoal(id) {

    const goal =
      findGoal(id);

    if (!goal) return;

    goal.completed =
      !goal.completed;

    save();

    if (goal.completed) {

      celebrate();

      playSound();

    }

    render();

  }


  /* -------------------------
     EDIT
  ------------------------- */

  function startEdit(goal) {

    const card =
      document.querySelector(
        `[data-goal-id="${goal.id}"]`
      );

    if (!card) return;


    const content =
      card.querySelector(".goal-content");

    const actions =
      card.querySelector(".goal-actions");


    content.innerHTML = "";


    const editInput =
      document.createElement("input");

    editInput.className =
      "edit-input";

    editInput.value =
      goal.text;

    editInput.maxLength = 120;


    const select =
      document.createElement("select");

    select.className =
      "edit-type";


    ["quick","small","big","future"]
      .forEach(type => {

        const option =
          document.createElement("option");

        option.value = type;

        option.textContent =
          sectionInfo[type].icon +
          " " +
          sectionInfo[type].name;

        option.selected =
          type === goal.type;

        select.appendChild(option);

      });


    content.appendChild(editInput);


    actions.innerHTML = `
      <button
        type="button"
        class="icon-button save-edit"
        title="Save">
        ✓
      </button>
      <button
        type="button"
        class="icon-button cancel-edit"
        title="Cancel">
        ×
      </button>
    `;


    content.appendChild(select);


    function saveEdit() {

      const newText =
        editInput.value.trim();

      if (!newText) {

        editInput.focus();

        return;

      }


      goal.text =
        newText;

      goal.type =
        select.value;

      save();

      render();

    }


    actions
      .querySelector(".save-edit")
      .addEventListener(
        "click",
        saveEdit
      );


    actions
      .querySelector(".cancel-edit")
      .addEventListener(
        "click",
        render
      );


    editInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {
          saveEdit();
        }

        if (event.key === "Escape") {
          render();
        }

      }
    );


    editInput.focus();

    editInput.select();

  }


  /* -------------------------
     DELETE
  ------------------------- */

  function deleteGoal(id) {

    goals =
      goals.filter(
        goal => goal.id !== id
      );

    save();

    render();

  }


  /* -------------------------
     MOVE UP / DOWN
  ------------------------- */

  function moveGoal(id, direction) {

    const goalIndex =
      goals.findIndex(
        goal => goal.id === id
      );

    if (goalIndex === -1) return;


    const goal =
      goals[goalIndex];


    /*
      Move only within the same
      category. This keeps the
      four sections organized.
    */

    const sameType =
      goals
        .map((g,index) => ({
          g,
          index
        }))
        .filter(item =>
          item.g.type === goal.type
        );


    const position =
      sameType.findIndex(
        item => item.g.id === id
      );


    const newPosition =
      position + direction;


    if (
      newPosition < 0 ||
      newPosition >= sameType.length
    ) {
      return;
    }


    const swapIndex =
      sameType[newPosition].index;


    const temp =
      goals[goalIndex];

    goals[goalIndex] =
      goals[swapIndex];

    goals[swapIndex] =
      temp;


    save();

    render();

  }


  /* -------------------------
     DRAG & DROP
  ------------------------- */

  let draggedId = null;


  function dragStart(event, goal) {

    draggedId =
      goal.id;

    event.dataTransfer.effectAllowed =
      "move";

    event.dataTransfer.setData(
      "text/plain",
      String(goal.id)
    );


    const card =
      event.currentTarget;

    card.classList.add("dragging");

  }


  function dragEnd(event) {

    event.currentTarget
      .classList
      .remove("dragging");

    draggedId = null;

    document
      .querySelectorAll(".drag-over")
      .forEach(card =>
        card.classList.remove("drag-over")
      );

  }


  function dragOver(event) {

    event.preventDefault();

    event.dataTransfer.dropEffect =
      "move";

    const card =
      event.currentTarget;

    card.classList.add("drag-over");

  }


  function dragLeave(event) {

    event.currentTarget
      .classList
      .remove("drag-over");

  }


  function dropGoal(event, targetGoal) {

    event.preventDefault();

    const targetCard =
      event.currentTarget;

    targetCard.classList.remove(
      "drag-over"
    );


    if (
      draggedId === null ||
      draggedId === targetGoal.id
    ) {
      return;
    }


    const dragged =
      findGoal(draggedId);

    if (!dragged) return;


    /*
      Dragging between sections
      is allowed and changes the
      goal category.
    */

    dragged.type =
      targetGoal.type;


    const draggedIndex =
      goals.findIndex(
        g => g.id === draggedId
      );

    const targetIndex =
      goals.findIndex(
        g => g.id === targetGoal.id
      );


    if (
      draggedIndex === -1 ||
      targetIndex === -1
    ) {
      return;
    }


    goals.splice(
      draggedIndex,
      1
    );


    let insertAt =
      goals.findIndex(
        g => g.id === targetGoal.id
      );


    if (insertAt === -1) {
      insertAt = goals.length;
    }


    goals.splice(
      insertAt,
      0,
      dragged
    );


    save();

    render();

  }


  /* -------------------------
     SUBTASK TOGGLE
  ------------------------- */

  function toggleSubtasks(id) {

    const goal =
      findGoal(id);

    if (!goal) return;

    goal.subtasksOpen =
      !goal.subtasksOpen;

    save();

    render();

  }


  /* -------------------------
     ADD SUBTASK
  ------------------------- */

  function addSubtask(
    goalId,
    inputElement
  ) {

    const text =
      inputElement.value.trim();

    if (!text) {

      inputElement.focus();

      return;

    }


    const goal =
      findGoal(goalId);

    if (!goal) return;


    goal.subtasks.push({

      id:
        Date.now() +
        Math.random(),

      text:text,

      completed:false

    });


    goal.subtasksOpen =
      true;


    save();

    render();

  }


  /* -------------------------
     COMPLETE SUBTASK
  ------------------------- */

  function completeSubtask(
    goalId,
    subtaskId
  ) {

    const goal =
      findGoal(goalId);

    if (!goal) return;


    const subtask =
      goal.subtasks.find(
        s => s.id === subtaskId
      );

    if (!subtask) return;


    subtask.completed =
      !subtask.completed;


    save();

    if (subtask.completed) {
      playSound();
    }

    render();

  }


  /* -------------------------
     DELETE SUBTASK
  ------------------------- */

  function deleteSubtask(
    goalId,
    subtaskId
  ) {

    const goal =
      findGoal(goalId);

    if (!goal) return;


    goal.subtasks =
      goal.subtasks.filter(
        s => s.id !== subtaskId
      );


    if (
      goal.subtasks.length === 0
    ) {

      goal.subtasksOpen =
        false;

    }


    save();

    render();

  }


  /* -------------------------
     RENDER
  ------------------------- */

  function render() {

    sections.innerHTML = "";


    const types =
      ["quick","small","big","future"];


    types.forEach(type => {

      let typeGoals =
        goals.filter(
          goal => goal.type === type
        );


      if (activeFilter !== "all") {

        if (activeFilter === "completed") {

          typeGoals =
            typeGoals.filter(
              goal => goal.completed
            );

        } else {

          if (activeFilter !== type) {
            typeGoals = [];
          }

        }

      }


      if (typeGoals.length === 0) {
        return;
      }


      const section =
        document.createElement("section");

      section.className =
        "goal-section";


      const header =
        document.createElement("div");

      header.className =
        "section-header";


      header.innerHTML = `

        <div class="section-title">

          <span>
            ${sectionInfo[type].icon}
          </span>

          <span>
            ${sectionInfo[type].name}
          </span>

          <span class="section-count">
            ${typeGoals.length}
          </span>

        </div>

        <div class="section-line"></div>

      `;


      const list =
        document.createElement("div");

      list.className =
        "goals";


      typeGoals.forEach(goal => {

        const card =
          createGoalCard(goal);

        list.appendChild(card);

      });


      section.appendChild(header);

      section.appendChild(list);

      sections.appendChild(section);

    });


    if (!sections.children.length) {

      sections.innerHTML = `

        <div class="empty">

          <div class="empty-icon">
            🍦
          </div>

          No goals here yet.

        </div>

      `;

    }


    updateProgress();

  }


  /* -------------------------
     GOAL CARD
  ------------------------- */

  function createGoalCard(goal) {

    const card =
      document.createElement("div");

    card.className =
      `goal ${goal.type}-goal ${
        goal.completed
          ? "completed"
          : ""
      }`;


    card.draggable = true;

    card.dataset.goalId =
      goal.id;


    /* DRAG EVENTS */

    card.addEventListener(
      "dragstart",
      event =>
        dragStart(event, goal)
    );

    card.addEventListener(
      "dragend",
      dragEnd
    );

    card.addEventListener(
      "dragover",
      dragOver
    );

    card.addEventListener(
      "dragleave",
      dragLeave
    );

    card.addEventListener(
      "drop",
      event =>
        dropGoal(event, goal)
    );


    /* MAIN */

    const main =
      document.createElement("div");

    main.className =
      "goal-main";


    /* HANDLE */

    const handle =
      document.createElement("button");

    handle.type = "button";

    handle.className =
      "drag-handle";

    handle.textContent =
      "⋮⋮";

    handle.title =
      "Drag to move";


    /*
      The whole card is draggable,
      but this visual handle makes
      the interaction obvious.
    */


    /* CHECK */

    const checkbox =
      document.createElement("button");

    checkbox.type = "button";

    checkbox.className =
      "checkbox";

    checkbox.textContent =
      goal.completed
        ? "✓"
        : "";


    checkbox.addEventListener(
      "click",
      () => completeGoal(goal.id)
    );


    /* CONTENT */

    const content =
      document.createElement("div");

    content.className =
      "goal-content";


    const name =
      document.createElement("div");

    name.className =
      "goal-name";

    name.textContent =
      goal.text;


    content.appendChild(name);


    /* ACTIONS */

    const actions =
      document.createElement("div");

    actions.className =
      "goal-actions";


    const edit =
      document.createElement("button");

    edit.type = "button";

    edit.className =
      "icon-button";

    edit.textContent =
      "✎";

    edit.title =
      "Edit";


    edit.addEventListener(
      "click",
      () => startEdit(goal)
    );


    const up =
      document.createElement("button");

    up.type = "button";

    up.className =
      "icon-button";

    up.textContent =
      "↑";

    up.title =
      "Move up";


    up.addEventListener(
      "click",
      () => moveGoal(goal.id, -1)
    );


    const down =
      document.createElement("button");

    down.type = "button";

    down.className =
      "icon-button";

    down.textContent =
      "↓";

    down.title =
      "Move down";


    down.addEventListener(
      "click",
      () => moveGoal(goal.id, 1)
    );


    const remove =
      document.createElement("button");

    remove.type = "button";

    remove.className =
      "icon-button";

    remove.textContent =
      "×";

    remove.title =
      "Delete";


    remove.addEventListener(
      "click",
      () => deleteGoal(goal.id)
    );


    actions.appendChild(edit);

    actions.appendChild(up);

    actions.appendChild(down);

    actions.appendChild(remove);


    main.appendChild(handle);

    main.appendChild(checkbox);

    main.appendChild(content);

    main.appendChild(actions);


    card.appendChild(main);


    /* SUBTASKS */

    if (
      goal.subtasksOpen ||
      goal.subtasks.length > 0
    ) {

      renderSubtasks(
        card,
        goal
      );

    } else {

      const toggle =
        document.createElement("button");

      toggle.type = "button";

      toggle.className =
        "subtask-toggle";

      toggle.textContent =
        "+ subtask";


      toggle.addEventListener(
        "click",
        () => toggleSubtasks(goal.id)
      );


      card.appendChild(toggle);

    }


    return card;

  }


  /* -------------------------
     SUBTASK RENDER
  ------------------------- */

  function renderSubtasks(
    parent,
    goal
  ) {

    const container =
      document.createElement("div");

    container.className =
      "subtasks";


    goal.subtasks.forEach(
      subtask => {

        const row =
          document.createElement("div");

        row.className =
          `subtask ${
            subtask.completed
              ? "done"
              : ""
          }`;


        const checkbox =
          document.createElement("button");

        checkbox.type = "button";

        checkbox.className =
          "subtask-checkbox";

        checkbox.textContent =
          subtask.completed
            ? "✓"
            : "";


        checkbox.addEventListener(
          "click",
          () =>
            completeSubtask(
              goal.id,
              subtask.id
            )
        );


        const text =
          document.createElement("div");

        text.className =
          "subtask-text";

        text.textContent =
          subtask.text;


        const remove =
          document.createElement("button");

        remove.type = "button";

        remove.className =
          "subtask-delete";

        remove.textContent =
          "×";


        remove.addEventListener(
          "click",
          () =>
            deleteSubtask(
              goal.id,
              subtask.id
            )
        );


        row.appendChild(checkbox);

        row.appendChild(text);

        row.appendChild(remove);

        container.appendChild(row);

      }
    );


    /* INPUT */

    const inputRow =
      document.createElement("div");

    inputRow.className =
      "subtask-input-row";


    const input =
      document.createElement("input");

    input.type = "text";

    input.className =
      "subtask-input";

    input.placeholder =
      "add a tiny step…";

    input.maxLength = 100;


    const add =
      document.createElement("button");

    add.type = "button";

    add.className =
      "subtask-add";

    add.textContent =
      "+";


    add.addEventListener(
      "click",
      () =>
        addSubtask(
          goal.id,
          input
        )
    );


    input.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          event.preventDefault();

          addSubtask(
            goal.id,
            input
          );

        }

        if (event.key === "Escape") {

          if (
            goal.subtasks.length === 0
          ) {

            goal.subtasksOpen =
              false;

            save();

            render();

          }

        }

      }
    );


    inputRow.appendChild(input);

    inputRow.appendChild(add);

    container.appendChild(inputRow);


    /* PROGRESS */

    if (goal.subtasks.length > 0) {

      const completed =
        goal.subtasks.filter(
          s => s.completed
        ).length;


      const progress =
        document.createElement("div");

      progress.className =
        "subtask-progress";

      progress.textContent =
        `${completed} / ${goal.subtasks.length} steps`;


      container.appendChild(progress);

    }


    parent.appendChild(container);

  }


  /* -------------------------
     PROGRESS
  ------------------------- */

  function updateProgress() {

    const total =
      goals.length;

    const completed =
      goals.filter(
        goal => goal.completed
      ).length;


    progressText.textContent =
      `${completed} / ${total}`;


    const percentage =
      total === 0
        ? 0
        : Math.round(
            completed / total * 100
          );


    progressFill.style.width =
      percentage + "%";

  }


  /* -------------------------
     FIND
  ------------------------- */

  function findGoal(id) {

    return goals.find(
      goal => goal.id === id
    );

  }


  /* -------------------------
     SAVE
  ------------------------- */

  function save() {

    try {

      localStorage.setItem(
        "iceCreamGoals",
        JSON.stringify(goals)
      );

    } catch(e) {}

  }


  /* -------------------------
     CONFETTI
  ------------------------- */

  function celebrate() {

    const colors = [
      "#f4df83",
      "#c9dcb5",
      "#b8c4e2",
      "#cbb49b",
      "#fff5c9"
    ];


    for (
      let i = 0;
      i < 25;
      i++
    ) {

      const piece =
        document.createElement("div");

      piece.className =
        "confetti";

      piece.style.left =
        window.innerWidth / 2 + "px";

      piece.style.top =
        window.innerHeight / 3 + "px";

      piece.style.background =
        colors[
          Math.floor(
            Math.random() *
            colors.length
          )
        ];

      piece.style.setProperty(
        "--x",
        ((Math.random() - .5) * 320) + "px"
      );

      piece.style.setProperty(
        "--y",
        ((Math.random() - .2) * 250) + "px"
      );

      document.body.appendChild(piece);

      setTimeout(
        () => piece.remove(),
        950
      );

    }

  }


  /* -------------------------
     SOUND
  ------------------------- */

  function playSound() {

    if (!soundEnabled) return;


    try {

      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!AudioContext) return;


      const ctx =
        new AudioContext();

      const oscillator =
        ctx.createOscillator();

      const gain =
        ctx.createGain();


      oscillator.type =
        "sine";

      oscillator.frequency.setValueAtTime(
        520,
        ctx.currentTime
      );

      oscillator.frequency.exponentialRampToValueAtTime(
        780,
        ctx.currentTime + .12
      );


      gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .14,
        ctx.currentTime + .01
      );

      gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .24
      );


      oscillator.connect(gain);

      gain.connect(ctx.destination);

      oscillator.start();

      oscillator.stop(
        ctx.currentTime + .24
      );

    } catch(e) {}

  }


  /* -------------------------
     SOUND TOGGLE
  ------------------------- */

  soundButton.addEventListener(
    "click",
    () => {

      soundEnabled =
        !soundEnabled;

      soundButton.textContent =
        soundEnabled
          ? "🔊"
          : "🔇";

    }
  );


  /* -------------------------
     START
  ------------------------- */

  render();

})();
</script>

</html>
